name: CI/CD Pipeline - RetailSense AI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ===================================================================
  # JOB 1: QUALIDADE DE CÓDIGO & LINTING
  # ===================================================================
  code-quality:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pydantic

      - name: Run Ruff Linter
        run: ruff check src/ tests/

      - name: Run Ruff Format Check
        run: ruff format --check src/ tests/

      - name: Run Mypy Static Type Checking
        run: mypy src/ --ignore-missing-imports

  # ===================================================================
  # JOB 2: TESTES UNITÁRIOS, INTEGRAÇÃO E EVALS RAGAS
  # ===================================================================
  backend-tests:
    name: Backend Tests & Evals
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Pytest Suite (Unit, Integration & Evals)
        run: pytest tests/ -v

  # ===================================================================
  # JOB 3: BUILD E COMPILAÇÃO DO FRONTEND REACT
  # ===================================================================
  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Compile TypeScript & Build Production Assets
        working-directory: ./frontend
        run: npm run build
