[project]
name = "retailsense-ai"
version = "0.2.0"
description = "Enterprise Conversational Analytics & Multi-Agent Text-to-SQL Platform for Retail/E-commerce"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "RetailSense AI Team" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "scalar-fastapi>=1.0.3",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlglot>=25.0.0",
    "sqlalchemy>=2.0.30",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "google-genai>=0.1.0",
    "pandas>=2.2.0",
    "datasets>=2.19.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "qdrant-client>=1.9.0",
    "fastembed>=0.3.0",
    "langfuse>=2.36.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.5",
    "mypy>=1.11.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ragas>=0.1.9",
    "pre-commit>=3.7.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
